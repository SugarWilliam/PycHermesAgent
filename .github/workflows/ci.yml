# PycHermesAgent — contract tests and preview release gates on push/PR.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Packaging probe smoke (simulated Windows-style dirs on Linux)
        run: |
          set -e
          ROOT="$(mktemp -d)"
          INSTALL="$ROOT/install"
          mkdir -p "$INSTALL"
          export APPDATA="$ROOT/Roaming"
          export LOCALAPPDATA="$ROOT/Local"
          export PYC_HERMES_ENFORCE_PACKAGING_RULES=1
          export PYC_HERMES_INSTALL_DIR="$INSTALL"
          pyc-hermes-packaging-probe --workspace-root "$INSTALL" --mkdirs

      - name: Quality gates (tests + whitespace + secret heuristics)
        run: python scripts/release_gates.py
