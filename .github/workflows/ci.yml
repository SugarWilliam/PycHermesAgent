# PycHermesAgent — contract tests and release gates on push/PR (see scripts/release_gates.py).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (uv.lock + dev)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: MRAG lexical vs hybrid proof (deterministic subset)
        run: uv run python benchmarks/mrag/run_lexical_hybrid_proof.py

      - name: MRAG expanded benchmark (Phase 3F)
        run: uv run python benchmarks/mrag/run_expanded_hybrid_benchmark.py

      - name: Packaging probe smoke (simulated Windows-style dirs on Linux)
        run: |
          set -e
          ROOT="$(mktemp -d)"
          INSTALL="$ROOT/install"
          mkdir -p "$INSTALL"
          export APPDATA="$ROOT/Roaming"
          export LOCALAPPDATA="$ROOT/Local"
          export PYC_HERMES_ENFORCE_PACKAGING_RULES=1
          export PYC_HERMES_INSTALL_DIR="$INSTALL"
          uv run pyc-hermes-packaging-probe --workspace-root "$INSTALL" --mkdirs

      - name: Quality gates (pytest + ruff + mypy + whitespace + secret heuristics)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          RELEASE_GATES_RUFF: "1"
          RELEASE_GATES_MYPY: "1"
        run: uv run python scripts/release_gates.py

  desktop-windows-unpacked:
    name: Desktop Windows unpacked (electron-builder)
    needs: contract-tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python (layout smoke harness)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci + audit + electron-vite win-unpacked
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          npm run dist:win-unpacked

      - name: Electron unpacked layout smoke (Windows)
        working-directory: ${{ github.workspace }}
        run: python scripts/electron_dist_layout_smoke.py desktop --require-unpacked-resources --prefer-unpacked win

  desktop-windows-nsis-silent:
    name: Windows NSIS silent dual-semver upgrade smoke
    needs: contract-tests
    timeout-minutes: 55
    # When you introduce a self-hosted Windows runner pool, duplicate this job replacing `runs-on` with labels
    # like `[self-hosted, windows-nsis]` and keep tooling versions aligned (`actions/setup-node` node-version).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps + build NSIS (semver prev)
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          npm pkg set version="0.99.0-ci.prev" --no-git-tag-version
          npm run dist:win

      - name: Stash prev installer
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _nsis_ci | Out-Null
          $exe = @(Get-ChildItem desktop/dist-installer -Filter *.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '(?i)unpacked' })[0]
          if (-not $exe) { throw "Prev NSIS exe not found under desktop/dist-installer" }
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path "_nsis_ci" "prev-setup.exe")
          Write-Host "Stashed prev:" $exe.Name

      - name: Clean unpacked outputs before next semver
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          Remove-Item desktop/dist-installer -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item desktop/out -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build NSIS (semver next)
        run: |
          npm pkg set version="0.99.1-ci.next" --no-git-tag-version
          npm run dist:win

      - name: Dual-semver silent upgrade + uninstall smoke
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem desktop/dist-installer -Filter *.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '(?i)unpacked' })[0]
          if (-not $exe) { throw "Next NSIS exe not found under desktop/dist-installer" }
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path "_nsis_ci" "next-setup.exe")

          ./scripts/windows_nsis_silent_upgrade_smoke.ps1 `
            -PreviousInstaller (Join-Path $PWD "_nsis_ci/prev-setup.exe") `
            -UpgradeInstaller (Join-Path $PWD "_nsis_ci/next-setup.exe") `
            -ExpectedVersionSubstringAfterUpgrade "ci.next"

  production-gates:
    name: Production packaging gates (lockfile, MRAG migrate, desktop dir pack)
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync Python (3.11) + GA optional deps
        run: uv sync --extra dev --extra ga --python 3.11

      - name: MRAG lexical vs hybrid proof (deterministic subset)
        run: uv run python benchmarks/mrag/run_lexical_hybrid_proof.py

      - name: MRAG expanded benchmark (Phase 3F)
        run: uv run python benchmarks/mrag/run_expanded_hybrid_benchmark.py

      - name: Production gate extras
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          RELEASE_GATES_PRODUCTION: "1"
          RELEASE_GATES_RUFF: "1"
          RELEASE_GATES_MYPY: "1"
          RELEASE_GATES_PYINSTALLER: "1"
        run: uv run python scripts/release_gates.py --no-pytest
