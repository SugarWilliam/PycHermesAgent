[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyc-hermes-agent"
version = "0.2.0"
description = "PycHermesAgent local sidecar and architecture baseline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Yaocheng Peng" }
]
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
]

[project.scripts]
pyc-hermes-sidecar = "pyc_hermes_agent.sidecar_api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
