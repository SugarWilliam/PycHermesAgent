[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyc-hermes-agent"
version = "0.2.1"
description = "PycHermesAgent local sidecar and architecture baseline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Yaocheng Peng" }
]
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.11",
]
ga = [
    "pyinstaller>=6.6",
]

[project.scripts]
pyc-hermes-sidecar = "pyc_hermes_agent.sidecar_api:main"
pyc-hermes-packaging-probe = "pyc_hermes_agent.packaging.probe:cli_main"
pyc-hermes-mrag-migrate = "pyc_hermes_agent.mrag_core.migrate:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "scripts"]
line-length = 160

[tool.ruff.lint]
# Ruff: pyflakes + pycodestyle (errors/warnings). Phase includes line-length=160 to keep E501 tractable.
select = ["F", "E", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"
